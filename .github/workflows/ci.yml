name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Dual-end protocol sync check (server/protocol.ts ↔ web/src/types.ts)
      - name: Check protocol sync
        run: node scripts/check-protocol-sync.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Pure-function unit tests (millisecond-scale, zero token)
      - name: Unit tests
        run: npx vitest run

      # Zero-token protocol smoke (each test starts an isolated server: own port + temp data-dir)
      - name: Protocol smoke tests
        run: node tests/run-smoke.mjs
